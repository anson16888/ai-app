<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 记忆翻牌游戏 - AI Hub</title>
    <style>
        /* 内联所有样式确保加载 */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #f0f4ff 0%, #ffffff 50%, #faf5ff 100%);
            min-height: 100vh;
            padding: 100px 20px 40px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .game-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .game-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .game-desc {
            color: #475569;
            font-size: 1.1rem;
        }

        .game-stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stat-label {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-restart {
            padding: 12px 24px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        /* 游戏棋盘 - 关键修复 */
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            max-width: 700px;
            margin: 0 auto 40px;
            perspective: 1000px;
        }

        /* 卡片样式 */
        .card {
            aspect-ratio: 1;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            min-height: 100px;
        }

        .card-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card-front {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
        }

        .card-front::before {
            content: '?';
            font-size: 2.5rem;
            font-weight: 900;
            color: rgba(255,255,255,0.8);
        }

        .card-back {
            background: white;
            transform: rotateY(180deg);
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            border: 2px solid #e2e8f0;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-name {
            font-size: 0.75rem;
            font-weight: 700;
            color: #0f172a;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            transform: rotateY(180deg);
            animation: matchPulse 0.5s ease;
        }

        @keyframes matchPulse {
            0%, 100% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); }
        }

        .nav-brand {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #0f172a;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 10px 16px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .nav-brand:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        /* 胜利弹窗 */
        .victory-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .victory-modal.show {
            display: flex;
        }

        .victory-content {
            background: white;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .victory-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .victory-content p {
            color: #475569;
            margin-bottom: 20px;
        }

        .victory-content strong {
            color: #6366f1;
            font-size: 1.2rem;
        }

        .btn-victory {
            padding: 14px 32px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-victory:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .game-board {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }

            .game-title {
                font-size: 1.8rem;
            }

            .stat-box {
                padding: 10px 15px;
            }

            .stat-value {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="nav-brand">← 返回首页</a>

    <div class="container">
        <div class="game-header">
            <h1 class="game-title">AI 模型记忆翻牌</h1>
            <p class="game-desc">翻开卡片，找出相同的 AI 模型配对！</p>
        </div>

        <div class="game-stats">
            <div class="stat-box">
                <div class="stat-label">步数</div>
                <div class="stat-value" id="moves">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">时间</div>
                <div class="stat-value" id="timer">00:00</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">配对</div>
                <div class="stat-value"><span id="pairs">0</span>/8</div>
            </div>
            <button class="btn-restart" id="restartBtn">重新开始</button>
        </div>

        <div class="game-board" id="gameBoard"></div>

        <div class="victory-modal" id="victoryModal">
            <div class="victory-content">
                <h2 class="victory-title">🎉 恭喜通关！</h2>
                <p>你成功匹配了所有 AI 模型！</p>
                <div style="margin-top: 20px;">
                    <span>总步数: <strong id="finalMoves">0</strong></span><br>
                    <span>用时: <strong id="finalTime">00:00</strong></span>
                </div>
                <button class="btn-victory" id="playAgainBtn">再玩一次</button>
            </div>
        </div>
    </div>

    <script>
        // AI 模型数据
        const aiModels = [
            { id: 'gpt4', name: 'GPT-4', gradient: 'linear-gradient(135deg, #10a37f, #1a7f64)', icon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="white" stroke-width="2"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>' },
            { id: 'claude', name: 'Claude', gradient: 'linear-gradient(135deg, #cc785c, #a85a3f)', icon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 3L15 9L21 10L17 14L18 20L12 17L6 20L7 14L3 10L9 9L12 3Z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/></svg>' },
            { id: 'gemini', name: 'Gemini', gradient: 'linear-gradient(135deg, #4285f4, #34a853, #fbbc05)', icon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="white" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>' },
            { id: 'deepseek', name: 'DeepSeek', gradient: 'linear-gradient(135deg, #6366f1, #4f46e5)', icon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h8l-1 8L20 10h-8l1-8z" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg>' },
            { id: 'qwen', name: 'Qwen', gradient: 'linear-gradient(135deg, #ff6a00, #ee0979)', icon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
            { id: 'llama', name: 'Llama', gradient: 'linear-gradient(135deg, #0052cc, #0065ff)', icon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="white" stroke-width="2"/><path d="M12 6v6l4 2" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>' },
            { id: 'grok', name: 'Grok', gradient: 'linear-gradient(135deg, #000000, #1a1a1a)', icon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
            { id: 'mistral', name: 'Mistral', gradient: 'linear-gradient(135deg, #ff6b35, #f7931e)', icon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 2L15 8L21 9L17 13L18 19L12 16L6 19L7 13L3 9L9 8L12 2Z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/></svg>' }
        ];

        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;
        let isProcessing = false;

        const gameBoard = document.getElementById('gameBoard');
        const movesDisplay = document.getElementById('moves');
        const timerDisplay = document.getElementById('timer');
        const pairsDisplay = document.getElementById('pairs');
        const restartBtn = document.getElementById('restartBtn');
        const victoryModal = document.getElementById('victoryModal');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const finalMoves = document.getElementById('finalMoves');
        const finalTime = document.getElementById('finalTime');

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function createCard(model, index) {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.id = model.id;

            card.innerHTML = `
                <div class="card-face card-front"></div>
                <div class="card-face card-back">
                    <div class="card-icon" style="background: ${model.gradient}">
                        ${model.icon}
                    </div>
                    <div class="card-name">${model.name}</div>
                </div>
            `;

            card.addEventListener('click', () => handleCardClick(card));
            return card;
        }

        function handleCardClick(card) {
            if (isProcessing || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            if (!gameStarted) {
                gameStarted = true;
                startTimer();
            }

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                movesDisplay.textContent = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            isProcessing = true;
            const [card1, card2] = flippedCards;

            if (card1.dataset.id === card2.dataset.id) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    pairsDisplay.textContent = matchedPairs;
                    flippedCards = [];
                    isProcessing = false;

                    if (matchedPairs === aiModels.length) {
                        endGame();
                    }
                }, 500);
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    isProcessing = false;
                }, 1000);
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timer++;
                const minutes = Math.floor(timer / 60).toString().padStart(2, '0');
                const seconds = (timer % 60).toString().padStart(2, '0');
                timerDisplay.textContent = `${minutes}:${seconds}`;
            }, 1000);
        }

        function endGame() {
            clearInterval(timerInterval);
            setTimeout(() => {
                finalMoves.textContent = moves;
                finalTime.textContent = timerDisplay.textContent;
                victoryModal.classList.add('show');
            }, 500);
        }

        function initGame() {
            cards = [];
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            timer = 0;
            gameStarted = false;
            isProcessing = false;

            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            movesDisplay.textContent = '0';
            timerDisplay.textContent = '00:00';
            pairsDisplay.textContent = '0';
            victoryModal.classList.remove('show');

            const cardPairs = [...aiModels, ...aiModels];
            shuffleArray(cardPairs);

            gameBoard.innerHTML = '';

            cardPairs.forEach((model, index) => {
                const card = createCard(model, index);
                cards.push(card);
                gameBoard.appendChild(card);
            });
        }

        restartBtn.addEventListener('click', initGame);
        playAgainBtn.addEventListener('click', initGame);

        // 页面加载完成后初始化
        initGame();
        console.log('游戏初始化完成，卡片数量:', gameBoard.children.length);
    </script>
</body>
</html>
