<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六年级上册英语单词记忆游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        /* Game Mode Switcher */
        .mode-switcher {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            border-color: #22c55e;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        .mode-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.3);
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            height: 30px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            color: white;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        /* ==================== FLASHCARD MODE ==================== */
        .flashcard-mode .card-container {
            perspective: 1000px;
            height: 320px;
            margin-bottom: 20px;
        }

        .flashcard-mode .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .flashcard-mode .card.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-mode .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .flashcard-mode .card-front {
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
        }

        .flashcard-mode .card-back {
            background: linear-gradient(145deg, #fef3c7, #fde68a);
            transform: rotateY(180deg);
        }

        .word-english {
            font-size: 2.2rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 10px;
            text-align: center;
        }

        .word-phonetic {
            font-size: 1.1rem;
            color: #6b7280;
            margin-bottom: 15px;
            font-style: italic;
        }

        .word-chinese {
            font-size: 1.8rem;
            color: #374151;
            text-align: center;
            margin-bottom: 15px;
        }

        .word-example {
            font-size: 0.95rem;
            color: #6b7280;
            text-align: center;
            font-style: italic;
            line-height: 1.5;
        }

        .unit-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
        }

        .hint-text {
            position: absolute;
            bottom: 15px;
            font-size: 0.8rem;
            color: #9ca3af;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 15px 25px;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-dont-know {
            background: linear-gradient(135deg, #f87171, #ef4444);
            color: white;
        }

        .btn-dont-know:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        .btn-know {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: white;
        }

        .btn-know:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
        }

        .btn-restart {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            color: white;
        }

        .btn-next {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: white;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-small {
            padding: 10px 20px;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-small:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* ==================== MEMORY GAME MODE ==================== */
        .memory-mode {
            display: none;
        }

        .memory-mode.active {
            display: block;
        }

        .flashcard-mode {
            display: block;
        }

        .flashcard-mode.hidden {
            display: none;
        }

        .memory-game-header {
            text-align: center;
            color: white;
            margin-bottom: 15px;
        }

        .memory-game-header h2 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .memory-stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 0.9rem;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        .memory-card {
            aspect-ratio: 1;
            perspective: 1000px;
            cursor: pointer;
        }

        .memory-card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }

        .memory-card.flipped .memory-card-inner,
        .memory-card.matched .memory-card-inner {
            transform: rotateY(180deg);
        }

        .memory-card-front, .memory-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .memory-card-front {
            background: linear-gradient(145deg, #667eea, #764ba2);
            font-size: 2rem;
        }

        .memory-card-back {
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            transform: rotateY(180deg);
        }

        .memory-card.matched .memory-card-back {
            background: linear-gradient(145deg, #dcfce7, #86efac);
        }

        .memory-card-back.english {
            font-size: 1rem;
            font-weight: bold;
            color: #1f2937;
            line-height: 1.3;
        }

        .memory-card-back.chinese {
            font-size: 1.2rem;
            color: #374151;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .memory-card-back.chinese .icon {
            font-size: 1.8rem;
        }

        .memory-card-back.chinese .text {
            font-size: 1rem;
        }

        /* Level Complete Modal */
        .level-complete-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .level-complete-modal.active {
            display: flex;
        }

        .level-complete-content {
            background: white;
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            animation: scaleIn 0.3s ease;
        }

        .level-complete-content h2 {
            color: #22c55e;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .level-complete-content .icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .level-complete-content p {
            color: #6b7280;
            margin-bottom: 10px;
        }

        .level-complete-content .words-learned {
            background: #f0fdf4;
            padding: 15px;
            border-radius: 15px;
            margin: 15px 0;
        }

        .level-complete-content .words-learned div {
            color: #374151;
            margin: 5px 0;
            font-size: 0.95rem;
        }

        /* Victory Screen */
        .victory-screen {
            display: none;
            text-align: center;
            color: white;
            animation: fadeIn 0.5s ease;
        }

        .victory-screen.active {
            display: block;
        }

        .victory-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: bounce 1s ease infinite;
        }

        .victory-title {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .victory-stats {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }

        .victory-stats p {
            margin: 10px 0;
            font-size: 1.1rem;
        }

        /* Word List Panel */
        .word-list-panel {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .word-list-panel.active {
            display: block;
        }

        .word-list-panel h3 {
            color: #1f2937;
            margin-bottom: 15px;
            text-align: center;
        }

        .word-item {
            padding: 10px 15px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .word-item.mastered {
            background: #dcfce7;
        }

        .word-item .en {
            font-weight: bold;
            color: #1f2937;
        }

        .word-item .cn {
            color: #6b7280;
        }

        .word-item .status {
            font-size: 1.2rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes matchPulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        .shake {
            animation: shake 0.5s ease;
        }

        .memory-card.matched {
            animation: matchPulse 0.5s ease;
        }

        /* Main content hide during victory */
        .main-content.hidden {
            display: none;
        }

        /* Scrollbar */
        .word-list-panel::-webkit-scrollbar {
            width: 8px;
        }

        .word-list-panel::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .word-list-panel::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .game-board {
                gap: 8px;
                padding: 8px;
            }

            .memory-card-back.english {
                font-size: 0.85rem;
            }

            .memory-card-back.chinese .icon {
                font-size: 1.4rem;
            }

            .memory-card-back.chinese .text {
                font-size: 0.85rem;
            }

            .word-english {
                font-size: 1.5rem;
            }

            .word-chinese {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Game Mode Switcher -->
        <div class="mode-switcher">
            <button class="mode-btn" id="flashcardBtn" onclick="switchMode('flashcard')">
                📚 记忆卡片
            </button>
            <button class="mode-btn active" id="memoryBtn" onclick="switchMode('memory')">
                🎮 记忆翻牌
            </button>
        </div>

        <!-- Flashcard Mode -->
        <div class="flashcard-mode" id="flashcardMode">
            <div class="main-content" id="mainContent">
                <div class="header">
                    <h1>六年级上册英语单词记忆卡片</h1>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill">0%</div>
                    </div>
                </div>

                <div class="stats">
                    <div>剩余单词: <span id="remainingCount">0</span></div>
                    <div>已掌握: <span id="masteredCount">0</span></div>
                    <div>总单词: <span id="totalCount">0</span></div>
                </div>

                <div class="card-container">
                    <div class="card" id="card">
                        <div class="card-face card-front">
                            <span class="unit-badge" id="unitBadge">Unit 1</span>
                            <div class="word-english" id="wordEnglish">science</div>
                            <div class="word-phonetic" id="wordPhonetic">/ˈsaɪəns/</div>
                            <div class="hint-text">点击卡片查看中文</div>
                        </div>
                        <div class="card-face card-back">
                            <div class="word-chinese" id="wordChinese">科学</div>
                            <div class="word-example" id="wordExample">The science museum is near the school.</div>
                        </div>
                    </div>
                </div>

                <div class="buttons">
                    <button class="btn btn-dont-know" onclick="dontKnow()">不认识</button>
                    <button class="btn btn-know" onclick="know()">认识</button>
                </div>

                <div class="controls">
                    <button class="btn-small" onclick="toggleWordList()">查看列表</button>
                    <button class="btn-small" onclick="resetFlashcardProgress()">重置进度</button>
                </div>

                <div class="word-list-panel" id="wordListPanel">
                    <h3>单词列表</h3>
                    <div id="wordList"></div>
                </div>
            </div>

            <!-- Victory Screen -->
            <div class="victory-screen" id="victoryScreen">
                <div class="victory-icon">🎉</div>
                <div class="victory-title">恭喜通关！</div>
                <div class="victory-stats">
                    <p>你已经掌握了所有六年级上册的英语单词！</p>
                    <p>总单词数: <span id="finalTotal">0</span></p>
                    <p>掌握单词: <span id="finalMastered">0</span></p>
                    <p>正确率: <span id="accuracy">0</span>%</p>
                </div>
                <button class="btn btn-restart" onclick="resetFlashcardProgress()">重新开始</button>
            </div>
        </div>

        <!-- Memory Game Mode -->
        <div class="memory-mode" id="memoryMode">
            <div class="memory-game-header">
                <h2>🎴 记忆翻牌游戏</h2>
                <div class="memory-stats">
                    <div>关卡: <span id="currentLevel">1</span> / <span id="totalLevels">0</span></div>
                    <div>翻牌次数: <span id="flipCount">0</span></div>
                    <div>已配对: <span id="matchedPairs">0</span> / 8</div>
                </div>
            </div>

            <div class="game-board" id="gameBoard"></div>

            <div class="controls">
                <button class="btn-small" onclick="restartLevel()">🔄 重新开始本关</button>
                <button class="btn-small" onclick="resetMemoryProgress()">🗑️ 重置所有进度</button>
            </div>
        </div>

        <!-- Level Complete Modal -->
        <div class="level-complete-modal" id="levelCompleteModal">
            <div class="level-complete-content">
                <div class="icon">🎊</div>
                <h2>恭喜过关！</h2>
                <p>你成功配对了所有单词！</p>
                <div class="words-learned" id="learnedWordsList"></div>
                <button class="btn btn-next" onclick="nextLevel()">下一关 ➡️</button>
            </div>
        </div>

        <!-- Memory Game Victory Screen -->
        <div class="victory-screen" id="memoryVictoryScreen">
            <div class="victory-icon">🏆</div>
            <div class="victory-title">完美通关！</div>
            <div class="victory-stats">
                <p>你已经完成了所有关卡！</p>
                <p>总关卡数: <span id="memoryTotalLevels">0</span></p>
                <p>总翻牌次数: <span id="memoryTotalFlips">0</span></p>
            </div>
            <button class="btn btn-restart" onclick="resetMemoryProgress()">重新开始</button>
        </div>
    </div>

    <script>
        // 人教版PEP六年级上册单词表
        const allWords = [
            // Unit 1: How can I get there?
            { word: "science", phonetic: "/ˈsaɪəns/", chinese: "科学", example: "The science museum is near the school.", unit: 1 },
            { word: "museum", phonetic: "/mju(ː)ˈzɪəm/", chinese: "博物馆", example: "Where is the science museum?", unit: 1 },
            { word: "post office", phonetic: "/pəʊst ˈɒfɪs/", chinese: "邮局", example: "I will go to the post office to send a letter.", unit: 1 },
            { word: "bookstore", phonetic: "/ˈbʊkstɔː/", chinese: "书店", example: "I want to buy an English book in a bookstore.", unit: 1 },
            { word: "cinema", phonetic: "/ˈsɪnəmə/", chinese: "电影院", example: "I will go to the cinema tomorrow.", unit: 1 },
            { word: "hospital", phonetic: "/ˈhɒspɪtl/", chinese: "医院", example: "He was born in this hospital.", unit: 1 },
            { word: "crossing", phonetic: "/ˈkrɒsɪŋ/", chinese: "十字路口", example: "You should be careful at the crossing.", unit: 1 },
            { word: "turn", phonetic: "/tɜːn/", chinese: "转弯", example: "You should turn right at the park.", unit: 1 },
            { word: "left", phonetic: "/left/", chinese: "左；左边", example: "You should turn left at the crossing.", unit: 1 },
            { word: "straight", phonetic: "/streɪt/", chinese: "笔直地", example: "Turn right. Then go straight.", unit: 1 },
            { word: "right", phonetic: "/raɪt/", chinese: "右；右边", example: "Turn right here.", unit: 1 },
            { word: "ask", phonetic: "/ɑːsk/", chinese: "问", example: "Can I ask you some questions?", unit: 1 },
            { word: "sir", phonetic: "/sɜː/", chinese: "先生", example: "Can I help you, sir?", unit: 1 },
            { word: "interesting", phonetic: "/ˈɪntrɪstɪŋ/", chinese: "有趣的", example: "This book is very interesting.", unit: 1 },
            { word: "Italian", phonetic: "/ɪˈtæliən/", chinese: "意大利的", example: "My cousin is an Italian girl.", unit: 1 },
            { word: "restaurant", phonetic: "/ˈrestrɒnt/", chinese: "餐馆", example: "This is a new restaurant.", unit: 1 },
            { word: "pizza", phonetic: "/ˈpiːtsə/", chinese: "比萨饼", example: "I like pizza.", unit: 1 },
            { word: "street", phonetic: "/striːt/", chinese: "大街；街道", example: "The cinema is on Dongfang Street.", unit: 1 },
            { word: "get", phonetic: "/get/", chinese: "到达", example: "How can I get there?", unit: 1 },
            { word: "GPS", phonetic: "/ʤiː-piː-es/", chinese: "全球（卫星）定位系统", example: "The GPS is new.", unit: 1 },
            { word: "gave", phonetic: "/geɪv/", chinese: "提供；交给", example: "I gave my sister a pen this morning.", unit: 1 },
            { word: "feature", phonetic: "/ˈfiːʧə/", chinese: "特点", example: "The dog has a new feature.", unit: 1 },
            { word: "follow", phonetic: "/ˈfɒləʊ/", chinese: "跟着", example: "Follow your mother, please.", unit: 1 },
            { word: "far", phonetic: "/fɑː/", chinese: "远的，遥远的", example: "My home is far from the zoo.", unit: 1 },
            { word: "tell", phonetic: "/tel/", chinese: "告诉，讲述", example: "Let me tell you my name.", unit: 1 },

            // Unit 2: Ways to go to school
            { word: "on foot", phonetic: "/ɒn fʊt/", chinese: "步行", example: "I go to school on foot.", unit: 2 },
            { word: "by", phonetic: "/baɪ/", chinese: "乘", example: "I go to school by bus.", unit: 2 },
            { word: "bus", phonetic: "/bʌs/", chinese: "公共汽车", example: "They go to the park by bus.", unit: 2 },
            { word: "plane", phonetic: "/pleɪn/", chinese: "飞机", example: "We will go the USA by plane.", unit: 2 },
            { word: "taxi", phonetic: "/ˈtæksi/", chinese: "出租汽车", example: "You can go there by taxi.", unit: 2 },
            { word: "ship", phonetic: "/ʃɪp/", chinese: "（大）船", example: "Let's go to Shanghai by ship.", unit: 2 },
            { word: "subway", phonetic: "/ˈsʌbweɪ/", chinese: "地铁", example: "You can go to the library by subway.", unit: 2 },

        // ==================== GAME MODE SWITCHING ====================
        let currentMode = 'memory';

        function switchMode(mode) {
            currentMode = mode;
            const flashcardBtn = document.getElementById('flashcardBtn');
            const memoryBtn = document.getElementById('memoryBtn');
            const flashcardMode = document.getElementById('flashcardMode');
            const memoryMode = document.getElementById('memoryMode');

            if (mode === 'flashcard') {
                flashcardBtn.classList.add('active');
                memoryBtn.classList.remove('active');
                flashcardMode.classList.remove('hidden');
                memoryMode.classList.remove('active');
            } else {
                flashcardBtn.classList.remove('active');
                memoryBtn.classList.add('active');
                flashcardMode.classList.add('hidden');
                memoryMode.classList.add('active');
                initMemoryGame();
            }
        }

        // ==================== FLASHCARD MODE ====================
        let remainingWords = [];
        let masteredWords = [];
        let currentWord = null;
        let totalAttempts = 0;

        function loadProgress() {
            const saved = localStorage.getItem('sixUpProgress');
            if (saved) {
                const data = JSON.parse(saved);
                masteredWords = data.masteredWords || [];
                totalAttempts = data.totalAttempts || 0;
            }
            remainingWords = allWords.filter(w => !masteredWords.includes(w.word));
            if (remainingWords.length === 0 && masteredWords.length > 0) {
                showVictory();
            } else {
                shuffleArray(remainingWords);
                showNextWord();
            }
            updateStats();
        }

        function saveProgress() {
            localStorage.setItem('sixUpProgress', JSON.stringify({
                masteredWords: masteredWords,
                totalAttempts: totalAttempts
            }));
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function showNextWord() {
            if (remainingWords.length === 0) {
                showVictory();
                return;
            }

            currentWord = remainingWords[0];
            document.getElementById('wordEnglish').textContent = currentWord.word;
            document.getElementById('wordPhonetic').textContent = currentWord.phonetic;
            document.getElementById('wordChinese').textContent = currentWord.chinese;
            document.getElementById('wordExample').textContent = currentWord.example || '';
            document.getElementById('unitBadge').textContent = `Unit ${currentWord.unit}`;
            document.getElementById('card').classList.remove('flipped');
        }

        document.getElementById('card').addEventListener('click', function() {
            this.classList.toggle('flipped');
        });

        function know() {
            if (!currentWord) return;
            totalAttempts++;
            masteredWords.push(currentWord.word);
            remainingWords.shift();
            saveProgress();
            updateStats();
            showNextWord();
        }

        function dontKnow() {
            if (!currentWord) return;
            totalAttempts++;
            const word = remainingWords.shift();
            remainingWords.push(word);
            const card = document.getElementById('card');
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 500);
            saveProgress();
            updateStats();
            showNextWord();
        }

        function updateStats() {
            const total = allWords.length;
            const mastered = masteredWords.length;
            const remaining = remainingWords.length;
            const progress = Math.round((mastered / total) * 100);

            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressFill').textContent = progress + '%';
            document.getElementById('remainingCount').textContent = remaining;
            document.getElementById('masteredCount').textContent = mastered;
            document.getElementById('totalCount').textContent = total;
        }

        function showVictory() {
            document.getElementById('mainContent').classList.add('hidden');
            document.getElementById('victoryScreen').classList.add('active');
            document.getElementById('finalTotal').textContent = allWords.length;
            document.getElementById('finalMastered').textContent = masteredWords.length;
            const accuracy = Math.round((masteredWords.length / Math.max(totalAttempts, 1)) * 100);
            document.getElementById('accuracy').textContent = Math.min(accuracy, 100);
        }

        function resetFlashcardProgress() {
            if (confirm('确定要重置学习进度吗？')) {
                localStorage.removeItem('sixUpProgress');
                masteredWords = [];
                totalAttempts = 0;
                remainingWords = [...allWords];
                shuffleArray(remainingWords);
                document.getElementById('mainContent').classList.remove('hidden');
                document.getElementById('victoryScreen').classList.remove('active');
                showNextWord();
                updateStats();
                updateWordList();
            }
        }

        function toggleWordList() {
            const panel = document.getElementById('wordListPanel');
            panel.classList.toggle('active');
            if (panel.classList.contains('active')) {
                updateWordList();
            }
        }

        function updateWordList() {
            const list = document.getElementById('wordList');
            list.innerHTML = '';
            allWords.forEach(w => {
                const item = document.createElement('div');
                item.className = 'word-item';
                if (masteredWords.includes(w.word)) {
                    item.classList.add('mastered');
                }
                item.innerHTML = `
                    <div>
                        <span class="en">${w.word}</span>
                        <span class="cn"> - ${w.chinese}</span>
                    </div>
                    <span class="status">${masteredWords.includes(w.word) ? '✅' : '⬜'}</span>
                `;
                list.appendChild(item);
            });
        }

        // ==================== MEMORY GAME MODE ====================
        let memoryState = {
            levels: [],
            currentLevel: 0,
            wordsPerLevel: 8,
            flipCount: 0,
            totalFlips: 0,
            flippedCards: [],
            matchedPairs: 0,
            locked: false
        };

        // 音效系统
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            switch (type) {
                case 'flip':
                    // 翻牌音效 - 轻快的"嗖"声
                    oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.1);
                    break;

                case 'match':
                    // 配对成功 - 欢快的"叮"声
                    oscillator.frequency.setValueAtTime(523, audioContext.currentTime); // C5
                    oscillator.frequency.setValueAtTime(659, audioContext.currentTime + 0.1); // E5
                    oscillator.frequency.setValueAtTime(784, audioContext.currentTime + 0.2); // G5
                    gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.4);
                    break;

                case 'wrong':
                    // 配对失败 - 低沉的"嗡"声
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 0.2);
                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.3);
                    break;

                case 'levelComplete':
                    // 过关音效 - 胜利旋律
                    const notes = [523, 659, 784, 1047]; // C5, E5, G5, C6
                    notes.forEach((freq, i) => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.1, audioContext.currentTime + i * 0.15);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + i * 0.15 + 0.3);
                        osc.start(audioContext.currentTime + i * 0.15);
                        osc.stop(audioContext.currentTime + i * 0.15 + 0.3);
                    });
                    break;

                case 'victory':
                    // 通关音效 - 华丽旋律
                    const victoryNotes = [523, 659, 784, 1047, 784, 1047, 1319];
                    victoryNotes.forEach((freq, i) => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.1, audioContext.currentTime + i * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + i * 0.12 + 0.25);
                        osc.start(audioContext.currentTime + i * 0.12);
                        osc.stop(audioContext.currentTime + i * 0.12 + 0.25);
                    });
                    break;
            }
        }

        function initMemoryGame() {
            // 恢复音频上下文（浏览器需要用户交互才能播放声音）
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            // Load or initialize memory game state
            const saved = localStorage.getItem('memoryGameProgress');
            if (saved) {
                const data = JSON.parse(saved);
                memoryState.currentLevel = data.currentLevel || 0;
                memoryState.totalFlips = data.totalFlips || 0;
            }

            // Create levels from words (8 words per level = 16 cards)
            const shuffledWords = [...allWords];
            shuffleArray(shuffledWords);
            memoryState.levels = [];
            for (let i = 0; i < shuffledWords.length; i += memoryState.wordsPerLevel) {
                memoryState.levels.push(shuffledWords.slice(i, i + memoryState.wordsPerLevel));
            }

            // Check if game is complete
            if (memoryState.currentLevel >= memoryState.levels.length) {
                showMemoryVictory();
            } else {
                startLevel(memoryState.currentLevel);
            }
        }

        function startLevel(levelIndex) {
            memoryState.currentLevel = levelIndex;
            memoryState.flipCount = 0;
            memoryState.matchedPairs = 0;
            memoryState.flippedCards = [];
            memoryState.locked = false;

            const words = memoryState.levels[levelIndex];
            createGameBoard(words);
            updateMemoryStats();
        }

        function createGameBoard(words) {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';

            // Create cards: 8 English + 8 Chinese
            let cards = [];
            words.forEach((word, index) => {
                cards.push({ id: index, type: 'english', text: word.word, pairId: index });
                cards.push({ id: index + 100, type: 'chinese', text: word.chinese, pairId: index });
            });
            shuffleArray(cards);

            cards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'memory-card';
                cardEl.dataset.index = index;
                cardEl.dataset.pairId = card.pairId;

                // 为中文卡片添加图标
                let cardContent = card.text;
                if (card.type === 'chinese') {
                    const icon = getIconForWord(card.text);
                    cardContent = `<span class="icon">${icon}</span><span class="text">${card.text}</span>`;
                }

                cardEl.innerHTML = `
                    <div class="memory-card-inner">
                        <div class="memory-card-front">?</div>
                        <div class="memory-card-back ${card.type}">${cardContent}</div>
                    </div>
                `;

                cardEl.addEventListener('click', () => flipCard(cardEl, card.pairId));
                board.appendChild(cardEl);
            });
        }

        function flipCard(cardEl, pairId) {
            if (memoryState.locked) return;
            if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

            // 播放翻牌音效
            playSound('flip');

            // Flip the card
            cardEl.classList.add('flipped');
            memoryState.flippedCards.push({ element: cardEl, pairId: pairId });
            memoryState.flipCount++;
            memoryState.totalFlips++;
            updateMemoryStats();

            // Check if two cards are flipped
            if (memoryState.flippedCards.length === 2) {
                memoryState.locked = true;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = memoryState.flippedCards;

            if (card1.pairId === card2.pairId) {
                // Match found - 播放配对成功音效
                setTimeout(() => {
                    playSound('match');
                    card1.element.classList.add('matched');
                    card2.element.classList.add('matched');
                    memoryState.matchedPairs++;
                    memoryState.flippedCards = [];
                    memoryState.locked = false;
                    updateMemoryStats();

                    // Check if level complete
                    if (memoryState.matchedPairs === memoryState.wordsPerLevel) {
                        setTimeout(showLevelComplete, 500);
                    }
                }, 500);
            } else {
                // No match - 播放配对失败音效
                setTimeout(() => {
                    playSound('wrong');
                    card1.element.classList.remove('flipped');
                    card2.element.classList.remove('flipped');
                    memoryState.flippedCards = [];
                    memoryState.locked = false;
                }, 1000);
            }
        }

        function updateMemoryStats() {
            const totalLevels = memoryState.levels.length;
            document.getElementById('currentLevel').textContent = memoryState.currentLevel + 1;
            document.getElementById('totalLevels').textContent = totalLevels;
            document.getElementById('flipCount').textContent = memoryState.flipCount;
            document.getElementById('matchedPairs').textContent = memoryState.matchedPairs;
        }

        function showLevelComplete() {
            // 播放过关音效
            playSound('levelComplete');

            const words = memoryState.levels[memoryState.currentLevel];
            const listEl = document.getElementById('learnedWordsList');
            listEl.innerHTML = '<p>本关学习的单词:</p>';
            words.forEach(w => {
                const div = document.createElement('div');
                div.textContent = `${w.word} - ${w.chinese}`;
                listEl.appendChild(div);
            });

            document.getElementById('levelCompleteModal').classList.add('active');
            saveMemoryProgress();
        }

        function nextLevel() {
            document.getElementById('levelCompleteModal').classList.remove('active');
            memoryState.currentLevel++;

            if (memoryState.currentLevel >= memoryState.levels.length) {
                showMemoryVictory();
            } else {
                startLevel(memoryState.currentLevel);
                saveMemoryProgress();
            }
        }

        function restartLevel() {
            startLevel(memoryState.currentLevel);
        }

        function showMemoryVictory() {
            // 播放通关音效
            playSound('victory');

            document.getElementById('memoryMode').style.display = 'none';
            document.getElementById('memoryVictoryScreen').classList.add('active');
            document.getElementById('memoryTotalLevels').textContent = memoryState.levels.length;
            document.getElementById('memoryTotalFlips').textContent = memoryState.totalFlips;
        }

        function resetMemoryProgress() {
            if (confirm('确定要重置记忆翻牌游戏的进度吗？')) {
                localStorage.removeItem('memoryGameProgress');
                memoryState = {
                    levels: [],
                    currentLevel: 0,
                    wordsPerLevel: 8,
                    flipCount: 0,
                    totalFlips: 0,
                    flippedCards: [],
                    matchedPairs: 0,
                    locked: false
                };
                document.getElementById('memoryVictoryScreen').classList.remove('active');
                document.getElementById('memoryMode').style.display = '';
                initMemoryGame();
            }
        }

        function saveMemoryProgress() {
            localStorage.setItem('memoryGameProgress', JSON.stringify({
                currentLevel: memoryState.currentLevel,
                totalFlips: memoryState.totalFlips
            }));
        }

        // Initialize memory game mode on load
        // 先设置正确的显示状态
        document.getElementById('flashcardMode').classList.add('hidden');
        document.getElementById('memoryMode').classList.add('active');
        initMemoryGame();

        // 同时初始化闪卡模式的进度（但不显示）
        const flashcardSaved = localStorage.getItem('sixUpProgress');
        if (flashcardSaved) {
            const data = JSON.parse(flashcardSaved);
            masteredWords = data.masteredWords || [];
            totalAttempts = data.totalAttempts || 0;
        }
        remainingWords = allWords.filter(w => !masteredWords.includes(w.word));
        shuffleArray(remainingWords);
    </script>
