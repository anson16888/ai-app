<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫雷游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: #f0f0f0;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 12px;
            background: #c0c0c0;
            border: 3px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
        }

        .counter {
            background: #000;
            color: #ff0000;
            font-family: 'Courier New', monospace;
            font-size: 32px;
            font-weight: bold;
            padding: 4px 8px;
            min-width: 80px;
            text-align: center;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
        }

        .reset-btn {
            width: 50px;
            height: 50px;
            font-size: 28px;
            border: 3px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            background: #c0c0c0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
        }

        .reset-btn:active {
            border-color: #808080 #ffffff #ffffff #808080;
        }

        .reset-btn.won {
            font-size: 24px;
        }

        .difficulty {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            justify-content: center;
        }

        .difficulty button {
            padding: 8px 16px;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            background: #c0c0c0;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.1s;
        }

        .difficulty button:hover {
            background: #d0d0d0;
        }

        .difficulty button.active {
            background: #a0a0a0;
            border-color: #808080 #ffffff #ffffff #808080;
        }

        .minefield {
            display: grid;
            gap: 0;
            background: #808080;
            border: 4px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            padding: 8px;
        }

        .cell {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            background: #c0c0c0;
            user-select: none;
            transition: background 0.05s;
        }

        .cell:hover:not(.revealed):not(.flagged) {
            background: #d0d0d0;
        }

        .cell.revealed {
            border: 1px solid #808080;
            background: #d0d0d0;
            cursor: default;
        }

        .cell.mine {
            background: #ff0000;
        }

        .cell.flagged::after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 12px solid #ff0000;
        }

        .cell.question::after {
            content: '?';
            color: #000;
        }

        .cell.exploded {
            background: #ff0000;
        }

        /* 数字颜色 */
        .cell[data-num="1"] { color: #0000ff; }
        .cell[data-num="2"] { color: #008000; }
        .cell[data-num="3"] { color: #ff0000; }
        .cell[data-num="4"] { color: #000080; }
        .cell[data-num="5"] { color: #800000; }
        .cell[data-num="6"] { color: #008080; }
        .cell[data-num="7"] { color: #000000; }
        .cell[data-num="8"] { color: #808080; }

        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .game-over-overlay.show {
            display: flex;
        }

        .game-over-message {
            background: #f0f0f0;
            padding: 30px 50px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .game-over-message h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .game-over-message.won h2 {
            color: #00aa00;
        }

        .game-over-message.lost h2 {
            color: #cc0000;
        }

        .game-over-message p {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }

        .play-again-btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .play-again-btn:hover {
            transform: scale(1.05);
        }

        .instructions {
            text-align: center;
            margin-top: 16px;
            color: #333;
            font-size: 13px;
        }

        .instructions span {
            display: inline-block;
            margin: 0 10px;
        }

        .instructions b {
            color: #667eea;
        }

        @media (max-width: 500px) {
            .cell {
                width: 24px;
                height: 24px;
                font-size: 14px;
            }

            .counter {
                font-size: 24px;
                min-width: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="difficulty">
            <button onclick="setDifficulty('easy')" id="btn-easy" class="active">初级</button>
            <button onclick="setDifficulty('medium')" id="btn-medium">中级</button>
            <button onclick="setDifficulty('hard')" id="btn-hard">高级</button>
        </div>

        <div class="game-header">
            <div class="counter" id="mineCount">010</div>
            <button class="reset-btn" id="resetBtn" onclick="initGame()">🙂</button>
            <div class="counter" id="timer">000</div>
        </div>

        <div class="minefield" id="minefield"></div>

        <div class="instructions">
            <span><b>左键</b> 揭开</span>
            <span><b>右键</b> 标记</span>
            <span><b>双击</b> 快速开</span>
        </div>
    </div>

    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-message" id="gameOverMessage">
            <h2 id="gameOverTitle">游戏结束</h2>
            <p id="gameOverText">你踩到地雷了！</p>
            <button class="play-again-btn" onclick="initGame()">再玩一次</button>
        </div>
    </div>

    <script>
        const difficulties = {
            easy: { rows: 9, cols: 9, mines: 10 },
            medium: { rows: 16, cols: 16, mines: 40 },
            hard: { rows: 16, cols: 30, mines: 99 }
        };

        let currentDifficulty = 'easy';
        let rows, cols, mines;
        let board = [];
        let revealed = [];
        let flagged = [];
        let gameOver = false;
        let firstClick = true;
        let minesLeft;
        let timer = 0;
        let timerInterval = null;

        const minefield = document.getElementById('minefield');
        const mineCountDisplay = document.getElementById('mineCount');
        const timerDisplay = document.getElementById('timer');
        const resetBtn = document.getElementById('resetBtn');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const gameOverMessage = document.getElementById('gameOverMessage');
        const gameOverTitle = document.getElementById('gameOverTitle');
        const gameOverText = document.getElementById('gameOverText');

        function setDifficulty(level) {
            currentDifficulty = level;
            document.querySelectorAll('.difficulty button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${level}`).classList.add('active');
            initGame();
        }

        function initGame() {
            const config = difficulties[currentDifficulty];
            rows = config.rows;
            cols = config.cols;
            mines = config.mines;
            minesLeft = mines;

            board = [];
            revealed = [];
            flagged = [];
            gameOver = false;
            firstClick = true;
            timer = 0;

            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            mineCountDisplay.textContent = formatNumber(mines);
            timerDisplay.textContent = '000';
            resetBtn.textContent = '🙂';
            resetBtn.classList.remove('won');
            gameOverOverlay.classList.remove('show');
            gameOverMessage.classList.remove('won', 'lost');

            createBoard();
        }

        function createBoard() {
            minefield.innerHTML = '';
            minefield.style.gridTemplateColumns = `repeat(${cols}, 28px)`;

            for (let r = 0; r < rows; r++) {
                board[r] = [];
                revealed[r] = [];
                flagged[r] = [];
                for (let c = 0; c < cols; c++) {
                    board[r][c] = 0;
                    revealed[r][c] = false;
                    flagged[r][c] = false;

                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    cell.addEventListener('click', (e) => handleClick(r, c));
                    cell.addEventListener('contextmenu', (e) => handleRightClick(r, c, e));
                    cell.addEventListener('dblclick', (e) => handleDoubleClick(r, c));

                    minefield.appendChild(cell);
                }
            }
        }

        function placeMines(excludeRow, excludeCol) {
            let placed = 0;
            while (placed < mines) {
                const r = Math.floor(Math.random() * rows);
                const c = Math.floor(Math.random() * cols);

                // Exclude first click and adjacent cells
                const isExcluded = Math.abs(r - excludeRow) <= 1 && Math.abs(c - excludeCol) <= 1;

                if (board[r][c] !== -1 && !isExcluded) {
                    board[r][c] = -1;
                    placed++;
                }
            }

            // Calculate numbers
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c] !== -1) {
                        board[r][c] = countAdjacentMines(r, c);
                    }
                }
            }
        }

        function countAdjacentMines(row, col) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const nr = row + dr;
                    const nc = col + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc] === -1) {
                        count++;
                    }
                }
            }
            return count;
        }

        function handleClick(row, col) {
            if (gameOver || flagged[row][col] || revealed[row][col]) return;

            if (firstClick) {
                firstClick = false;
                placeMines(row, col);
                startTimer();
            }

            revealCell(row, col);
            checkWin();
        }

        function handleRightClick(row, col, e) {
            e.preventDefault();
            if (gameOver || revealed[row][col]) return;

            const cell = getCell(row, col);

            if (flagged[row][col]) {
                flagged[row][col] = false;
                cell.classList.remove('flagged');
                minesLeft++;
            } else if (minesLeft > 0) {
                flagged[row][col] = true;
                cell.classList.add('flagged');
                minesLeft--;
            }

            mineCountDisplay.textContent = formatNumber(minesLeft);
        }

        function handleDoubleClick(row, col) {
            if (gameOver || !revealed[row][col]) return;

            const adjacentFlags = countAdjacentFlags(row, col);
            const adjacentMines = countAdjacentMines(row, col);

            if (adjacentFlags === adjacentMines && adjacentMines > 0) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = row + dr;
                        const nc = col + dc;
                        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols &&
                            !revealed[nr][nc] && !flagged[nr][nc]) {
                            if (firstClick) {
                                firstClick = false;
                                placeMines(nr, nc);
                                startTimer();
                            }
                            revealCell(nr, nc);
                        }
                    }
                }
            }
            checkWin();
        }

        function countAdjacentFlags(row, col) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const nr = row + dr;
                    const nc = col + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && flagged[nr][nc]) {
                        count++;
                    }
                }
            }
            return count;
        }

        function revealCell(row, col) {
            if (row < 0 || row >= rows || col < 0 || col >= cols) return;
            if (revealed[row][col] || flagged[row][col]) return;

            revealed[row][col] = true;
            const cell = getCell(row, col);
            cell.classList.add('revealed');

            if (board[row][col] === -1) {
                // Hit a mine
                cell.classList.add('exploded');
                gameOver = true;
                revealAllMines();
                endGame(false);
                return;
            }

            if (board[row][col] > 0) {
                cell.textContent = board[row][col];
                cell.dataset.num = board[row][col];
            } else {
                // Empty cell, reveal adjacent
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        revealCell(row + dr, col + dc);
                    }
                }
            }
        }

        function revealAllMines() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c] === -1) {
                        const cell = getCell(r, c);
                        cell.classList.add('revealed', 'mine');
                        cell.textContent = '💣';
                    }
                }
            }
        }

        function checkWin() {
            if (gameOver) return;

            let unrevealedSafeCells = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (!revealed[r][c] && board[r][c] !== -1) {
                        unrevealedSafeCells++;
                    }
                }
            }

            if (unrevealedSafeCells === 0) {
                gameOver = true;
                endGame(true);
            }
        }

        function endGame(won) {
            clearInterval(timerInterval);

            if (won) {
                resetBtn.textContent = '😎';
                resetBtn.classList.add('won');
                gameOverTitle.textContent = '🎉 恭喜获胜！';
                gameOverText.textContent = `用时: ${timer} 秒`;
                gameOverMessage.classList.add('won');
            } else {
                resetBtn.textContent = '😵';
                gameOverTitle.textContent = '💥 游戏结束';
                gameOverText.textContent = '你踩到地雷了！';
                gameOverMessage.classList.add('lost');
            }

            setTimeout(() => {
                gameOverOverlay.classList.add('show');
            }, 500);
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timer++;
                timerDisplay.textContent = formatNumber(Math.min(timer, 999));
            }, 1000);
        }

        function formatNumber(num) {
            return Math.abs(num).toString().padStart(3, '0');
        }

        function getCell(row, col) {
            return minefield.children[row * cols + col];
        }

        // Initialize game on load
        initGame();
    </script>
</body>
</html>
